    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #04121B;

      display: flex;
      flex-direction: column;
    }
    .top-header {
      height: 80px;

      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 20px;
    }
    .logo-box {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-img {
      height: 38px;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #F8F9F9;
    }
    .badge-pill {
      background: rgba(229,185,16,0.12);
      border: 1px solid rgba(229,185,16,0.35);
      color: #E5B910;
      font-size: 15px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .video-viewport {

      width: 980px;
      height: 760px;
      border-radius: 28px;
      border: 2px solid rgba(229,185,16,0.35);
      position: relative;
      background: #000;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    .video-overlay-tag {
      position: absolute;
      top: 24px;
      left: 24px;
      background: rgba(4,18,27,0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(229,185,16,0.4);
      padding: 10px 22px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #FFF;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.04em;
      z-index: 10;
    }
    .bottom-content {
      margin-top: 32px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .safe-footer {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 14px;
      font-size: 16px;
      color: #94A3B8;
      font-weight: 600;
    }
