<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #F8F9F9;
    color: #061B28;
    font-family: 'Manrope', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .canvas {
    width: 1080px;
    height: 1350px;
    padding: 96px 96px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: #F8F9F9;
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand img { height: 38px; }
  .brand span {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #061B28;
  }
  .tag {
    font-family: 'Geist Mono', monospace;
    font-size: 16px;
    color: #526370;
    background: #ECEFF1;
    padding: 10px 20px;
    border-radius: 999px;
  }
  .center {
    margin: auto 0;
  }
  h1 {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 108px;
    font-weight: 400;
    line-height: 0.98;
    letter-spacing: -0.015em;
    color: #061B28;
  }
  .highlight {
    display: inline-block;
    background: #E5B910;
    color: #061B28;
    font-style: italic;
    padding: 0 18px 6px;
    border-radius: 12px;
    margin-top: 12px;
  }
  p {
    margin-top: 48px;
    font-size: 30px;
    line-height: 1.45;
    color: #243542;
    font-weight: 500;
    max-width: 780px;
  }
  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 40px;
    border-top: 1px solid rgba(6, 27, 40, 0.12);
  }
  .meta {
    font-family: 'Geist Mono', monospace;
    font-size: 18px;
    color: #526370;
  }
  .cta {
    background: #061B28;
    color: #F8F9F9;
    font-size: 22px;
    font-weight: 700;
    padding: 18px 34px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="top">
      <div class="brand">
        <img src="file:///C:/Users/edubo/.gemini/antigravity/worktrees/QG%20Voca%C3%A7%C3%A3o%202027%20do%20zero/criar_chat_publicitario_vocacao/documentacao/Logotipo%20Voca%C3%A7%C3%A3o%202027.svg" alt="Vocação" />
        <span>Vocação</span>
      </div>
      <span class="tag">Sites · Google Maps · Tour 360°</span>
    </div>

    <div class="center">
      <h1>
        Tem gente procurando seu serviço agora.
        <span class="highlight">Vão achar você</span><br/>
        ou o vizinho?
      </h1>
      <p>
        Você paga 50% na entrada e os outros 50% só depois que ver tudo funcionando no ar.
      </p>
    </div>

    <div class="bottom">
      <span class="meta">Sem mensalidade · Pronto em 5 a 7 dias</span>
      <div class="cta">vocacao.digital ↗</div>
    </div>
  </div>
</body>
</html>
