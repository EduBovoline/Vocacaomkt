<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,200..900,0..100;1,9..144,200..900,0..100&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  body { overflow: auto; }
  .lm-nav .ghost svg { width: 14px; height: 14px; }
  .lm-input[type="email"], .lm-input[type="tel"], .lm-input[type="text"] { font-size: 18px; }
  .lm-textarea { min-height: 120px; resize: vertical; font-family: inherit; }
  .lm-summary {
    background: var(--bg-2);
    border-radius: 12px;
    padding: 28px 32px;
    margin: 30px 0 40px;
    text-align: left;
  }
  .lm-summary h4 {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 18px;
    font-weight: 500;
  }
  .lm-summary .row {
    display: flex; justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 14px;
    gap: 16px;
  }
  .lm-summary .row:last-child { border-bottom: 0; }
  .lm-summary .row span { color: var(--ink-2); }
  .lm-summary .row b { color: var(--ink); font-weight: 500; text-align: right; }
  .lm-final-marks {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    max-width: 720px;
    margin: 30px auto 0;
  }
  .lm-final-marks .m {
    background: var(--bg-2);
    border-radius: 10px;
    padding: 18px;
    text-align: left;
  }
  .lm-final-marks .m b {
    font-family: var(--display);
    font-variation-settings: "opsz" 144, "SOFT" 20;
    font-size: 28px;
    line-height: 1;
    color: var(--accent);
    display: block;
    margin-bottom: 6px;
    letter-spacing: -0.02em;
  }
  .lm-final-marks .m span {
    font-size: 12px;
    color: var(--ink-2);
    line-height: 1.4;
    display: block;
  }
  @media (max-width: 600px) { .lm-final-marks { grid-template-columns: 1fr; } }
  .step-anim {
    animation: stepIn 0.5s cubic-bezier(.16,1,.3,1);
  }
  @keyframes stepIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .no-anim .step-anim { animation: none !important; }
  .brand-logo { height: 24px; vertical-align: middle; margin-right: 8px; }
</style>
</head>
<body class="is-landing">

<!-- NAV (minimal) -->
<header class="nav" id="nav">

    <a href="/" class="brand"><img src="logo-vocacao.png" alt="Vocação" class="brand-logo" /> Vocação</a>

    <a href="https://wa.me/5515981512083" class="btn btn-ghost magnet">WhatsApp direto</a>
  </div>
</header>

<!-- LEAD MACHINE -->
<div class="lm-shell">
  <div class="wrap">
    <div class="lm-progress">
      <div class="lm-progress-bar" id="progressBar" style="width: 10%;"></div>
    </div>
    <div class="lm-step-meta">
      <span id="stepCounter">Passo 01 de 09</span>
      <span id="stepTime">~ 4 min · sem compromisso</span>
    </div>
  </div>

  <div class="wrap">
    <div class="lm-question step-anim" id="questionArea">
      <!-- Dynamic content -->
    </div>

    <div class="lm-nav">
      <button class="ghost" id="prevBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
        Voltar
      </button>
      <button class="btn btn-primary magnet" id="nextBtn" type="button">
        Continuar
        <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"></path></svg>
      </button>
    </div>
  </div>
</div>

<a class="wa-float" href="https://wa.me/5515981512083" aria-label="WhatsApp">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11.94 11.94 0 0 0 12 0C5.4 0 0 5.4 0 12c0 2.1.6 4.2 1.7 6L0 24l6.2-1.6c1.7.9 3.7 1.4 5.8 1.4 6.6 0 12-5.4 12-12 0-3.2-1.2-6.2-3.5-8.3z"></path></svg>
</a>

</script>
<script src="motion.js"></script>
<script src="lead-machine.js"></script>
</body>
</html>
