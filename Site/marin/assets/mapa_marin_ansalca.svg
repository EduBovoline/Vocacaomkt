<svg viewBox="0 0 880 580" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; border-radius:14px; background:#0c0e15; font-family:'Montserrat', sans-serif;">
  <defs>
    <!-- Filtros de Brilho e Sombra -->
    <filter id="glow-route" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="shadow-pin" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <!-- Padrão de Grelha Urbana -->
    <pattern id="urban-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#171a26"/>
    </pattern>

    <!-- Gradiente da Rota Principal (Av. Santa Helena -> R. Itá -> R. Estância) -->
    <linearGradient id="route-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#F5A602" />
    </linearGradient>
  </defs>

  <!-- Fundo do Mapa -->
  <rect width="880" height="580" fill="#0d0f17"/>
  <rect width="880" height="580" fill="url(#urban-grid)"/>

  <!-- ============================================== -->
  <!-- 1. TRAÇADO DE RUAS SECUNDÁRIAS (BACKGROUND)    -->
  <!-- ============================================== -->
  <g stroke="#1e2233" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <!-- Ruas do bairro à esquerda de Santa Helena -->
    <line x1="160" y1="40" x2="380" y2="240" />
    <line x1="200" y1="20" x2="420" y2="220" />
    <line x1="240" y1="20" x2="440" y2="200" />
    <!-- R. Santa Rita / R. Carlo Bauducco -->
    <line x1="140" y1="360" x2="440" y2="280" />
    <line x1="100" y1="420" x2="420" y2="340" />
    <line x1="60" y1="480" x2="400" y2="400" />
    <!-- R. Angical -->
    <line x1="450" y1="520" x2="860" y2="350" stroke="#252a3f" stroke-width="12"/>
    <!-- R. Turvo -->
    <line x1="500" y1="560" x2="860" y2="420" stroke="#222638" stroke-width="10"/>
    <!-- R. Baianópolis / R. Irani / R. Jutaí transversais -->
    <line x1="720" y1="330" x2="780" y2="520" stroke="#202538" stroke-width="8"/>
    <line x1="780" y1="310" x2="840" y2="500" stroke="#202538" stroke-width="8"/>
  </g>

  <!-- ============================================== -->
  <!-- 2. AS 7 GRANDES REFERÊNCIAS DO BAIRRO          -->
  <!-- ============================================== -->

  <!-- REFERÊNCIA 5: AV. JOSÉ MIGUEL ACKEL (Eixo Arterial Oeste) -->
  <g>
    <!-- Pista Ackel -->
    <line x1="100" y1="-20" x2="250" y2="600" stroke="#1f2538" stroke-width="26"/>
    <line x1="100" y1="-20" x2="250" y2="600" stroke="#272f47" stroke-width="20"/>
    <line x1="100" y1="-20" x2="250" y2="600" stroke="#10b981" stroke-width="2" stroke-dasharray="10,8" opacity="0.6"/>
    
    <!-- Badge Ackel -->
    <g transform="translate(145, 230) rotate(76)">
      <rect x="-85" y="-12" width="170" height="24" rx="5" fill="#0d111a" stroke="#10b981" stroke-width="1.2" filter="url(#shadow-card)"/>
      <text x="0" y="4" fill="#6ee7b7" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="0.5">
        5. AV. JOSÉ MIGUEL ACKEL
      </text>
    </g>
    <text x="95" y="25" fill="#64748b" font-size="8.5" font-weight="700">➔ Pimentas / Ayrton Senna</text>
    <text x="210" y="565" fill="#64748b" font-size="8.5" font-weight="700">➔ Dutra / Cecap</text>
  </g>

  <!-- REFERÊNCIA 2: CEU PARAÍSO ALVORADA (Complexo Educacional / Cultural) -->
  <g transform="translate(480, 130)" filter="url(#shadow-card)">
    <!-- Área do CEU -->
    <rect x="0" y="0" width="145" height="75" rx="8" fill="#121a24" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="6" y="6" width="133" height="63" rx="5" fill="#152332" stroke="#1e3a5f" stroke-width="1"/>
    
    <!-- Ícone e Textos -->
    <circle cx="24" cy="24" r="12" fill="#083344" stroke="#06b6d4" stroke-width="1"/>
    <text x="24" y="28" fill="#22d3ee" font-size="12" text-anchor="middle">🎓</text>
    <text x="44" y="24" fill="#a5f3fc" font-size="10.5" font-weight="900">CEU PARAÍSO</text>
    <text x="44" y="36" fill="#38bdf8" font-size="9" font-weight="800">ALVORADA</text>
    <rect x="10" y="46" width="125" height="17" rx="3" fill="#0c1929"/>
    <text x="72" y="58" fill="#7dd3fc" font-size="7.5" font-weight="600" text-anchor="middle">Grande Marco Educacional</text>
  </g>

  <!-- REFERÊNCIA 3: PANDURATA ALIMENTOS / FÁBRICA BAUDUCCO -->
  <g transform="translate(320, 290)" filter="url(#shadow-card)">
    <!-- Área da Fábrica -->
    <polygon points="0,20 120,-35 150,45 30,100" fill="#1c180a" stroke="#f59e0b" stroke-width="1.8"/>
    <!-- Badge Fábrica Bauducco -->
    <g transform="translate(70, 35)">
      <rect x="-80" y="-18" width="160" height="36" rx="6" fill="#181305" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="-62" cy="0" r="9" fill="#f59e0b"/>
      <text x="-62" y="4" fill="#000" font-size="11" font-weight="900" text-anchor="middle">B</text>
      <text x="14" y="-3" fill="#fbbf24" font-size="9.5" font-weight="900" text-anchor="middle">3. FÁBRICA BAUDUCCO</text>
      <text x="14" y="10" fill="#fef3c7" font-size="7.5" font-weight="600" text-anchor="middle">Pandurata Alimentos • Loja de Fábrica</text>
    </g>
  </g>

  <!-- REFERÊNCIA 4: CONDOMÍNIO RESIDENCIAL PARQUE SANTA TERESA -->
  <g transform="translate(640, 215)" filter="url(#shadow-card)">
    <!-- Bloco Residencial -->
    <rect x="0" y="0" width="190" height="95" rx="8" fill="#121824" stroke="#8b5cf6" stroke-width="1.5"/>
    <!-- Mini Prédios / Blocos de Apartamento -->
    <g fill="#1a2236" stroke="#2d3752" stroke-width="1">
      <rect x="10" y="10" width="22" height="18" rx="2"/>
      <rect x="40" y="10" width="22" height="18" rx="2"/>
      <rect x="70" y="10" width="22" height="18" rx="2"/>
      <rect x="100" y="10" width="22" height="18" rx="2"/>
      <rect x="130" y="10" width="22" height="18" rx="2"/>
      <rect x="160" y="10" width="20" height="18" rx="2"/>

      <rect x="10" y="35" width="22" height="18" rx="2"/>
      <rect x="40" y="35" width="22" height="18" rx="2"/>
      <rect x="70" y="35" width="22" height="18" rx="2"/>
      <rect x="100" y="35" width="22" height="18" rx="2"/>
      <rect x="130" y="35" width="22" height="18" rx="2"/>
      <rect x="160" y="35" width="20" height="18" rx="2"/>
    </g>
    <!-- Badge Condomínio -->
    <rect x="10" y="64" width="170" height="22" rx="4" fill="#1e1638" stroke="#a78bfa" stroke-width="1"/>
    <text x="95" y="79" fill="#ddd6fe" font-size="8.5" font-weight="900" text-anchor="middle">
      4. COND. PQ. SANTA TERESA
    </text>
  </g>


  <!-- ============================================== -->
  <!-- 3. A ROTA PRINCIPAL DE NAVEGAÇÃO DO PRINT      -->
  <!-- ============================================== -->

  <!-- REFERÊNCIA 1: AV. SANTA HELENA (Eixo Roxo de Chegada) -->
  <!-- Base da via -->
  <line x1="220" y1="-20" x2="495" y2="310" stroke="#1c2033" stroke-width="32" stroke-linecap="round"/>
  <!-- Faixa Roxa da Rota (Exatamente como o print da navegação) -->
  <line x1="220" y1="-20" x2="495" y2="310" stroke="#4f46e5" stroke-width="20" stroke-linecap="round" filter="url(#glow-route)"/>
  <line x1="220" y1="-20" x2="495" y2="310" stroke="#818cf8" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Badge Av. Santa Helena -->
  <g transform="translate(340, 130) rotate(50)">
    <rect x="-85" y="-13" width="170" height="26" rx="5" fill="#1e1b4b" stroke="#a5b4fc" stroke-width="1.5" filter="url(#shadow-card)"/>
    <text x="0" y="4" fill="#ffffff" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">
      1. AV. SANTA HELENA
    </text>
  </g>
  <text x="210" y="20" fill="#a5b4fc" font-size="9" font-weight="800">➔ Chegada Principal</text>


  <!-- REFERÊNCIA 6: RUA ITÁ (Continuação da descida para o Ansalca) -->
  <line x1="495" y1="310" x2="570" y2="520" stroke="#1c2033" stroke-width="26" stroke-linecap="round"/>
  <!-- Rota Roxa continuando pela Rua Itá -->
  <line x1="495" y1="310" x2="540" y2="445" stroke="#4f46e5" stroke-width="18" stroke-linecap="round" filter="url(#glow-route)"/>
  <line x1="495" y1="310" x2="540" y2="445" stroke="#818cf8" stroke-width="12" stroke-linecap="round"/>

  <!-- Badge Rua Itá -->
  <g transform="translate(545, 410) rotate(70)">
    <rect x="-60" y="-11" width="120" height="22" rx="4" fill="#0d111a" stroke="#60a5fa" stroke-width="1.2" filter="url(#shadow-card)"/>
    <text x="0" y="4" fill="#93c5fd" font-size="9.5" font-weight="900" text-anchor="middle">
      6. RUA ITÁ
    </text>
  </g>


  <!-- REFERÊNCIA 7: RUA ESTÂNCIA & DESTINO FINAL (MARIN REFEIÇÕES) -->
  <!-- Base da Rua Estância -->
  <line x1="480" y1="465" x2="840" y2="330" stroke="#1c2033" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Curva da Rota entrando na Rua Estância com Brilho Dourado -->
  <path d="M 525 400 L 540 445 L 610 420" fill="none" stroke="#F5A602" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-route)"/>
  <path d="M 525 400 L 540 445 L 610 420" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Badge Rua Estância -->
  <g transform="translate(680, 390) rotate(-20)">
    <rect x="-65" y="-11" width="130" height="22" rx="4" fill="#1c1404" stroke="#F5A602" stroke-width="1.5" filter="url(#shadow-card)"/>
    <text x="0" y="4" fill="#fde68a" font-size="9.5" font-weight="900" text-anchor="middle" letter-spacing="0.4">
      7. RUA ESTÂNCIA
    </text>
  </g>


  <!-- ============================================== -->
  <!-- PIN VERMELHO / DOURADO OFICIAL NO DESTINO      -->
  <!-- ============================================== -->
  <g transform="translate(615, 420)">
    <!-- Ondas de Pulso do Radar -->
    <circle cx="0" cy="0" r="34" fill="rgba(239, 68, 68, 0.15)">
      <animate attributeName="r" values="18;45;18" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.05;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="16" fill="rgba(239, 68, 68, 0.3)"/>

    <!-- Pin Vermelho (Fiel ao print do usuário) -->
    <g transform="translate(0, -32)" filter="url(#shadow-pin)">
      <path d="M 0 34 C -3 27 -14 16 -14 7 C -14 -4 -6 -12 0 -12 C 6 -12 14 -4 14 7 C 14 16 3 27 0 34 Z" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="5" r="5" fill="#ffffff"/>
      <circle cx="0" cy="5" r="2.5" fill="#ef4444"/>
    </g>

    <!-- Balão de Destaque Flutuante: MARIN REFEIÇÕES Nº 334 -->
    <g transform="translate(0, -74)" filter="url(#shadow-card)">
      <rect x="-120" y="-24" width="240" height="44" rx="8" fill="#141724" stroke="#F5A602" stroke-width="2.2"/>
      <!-- Seta indicadora -->
      <polygon points="-8,20 8,20 0,27" fill="#141724"/>
      <polygon points="-8,20 0,27 8,20" fill="none" stroke="#F5A602" stroke-width="2.2"/>
      
      <text x="0" y="-7" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="0.5">
        MARIN REFEIÇÕES
      </text>
      <text x="0" y="10" fill="#F5A602" font-size="10" font-weight="800" text-anchor="middle">
        📍 R. Estância, 334 • Balcão de Retirada
      </text>
    </g>
  </g>


  <!-- ============================================== -->
  <!-- BARRA INFERIOR DAS 7 REFERÊNCIAS LEGENDA       -->
  <!-- ============================================== -->
  <g transform="translate(20, 525)" filter="url(#shadow-card)">
    <rect x="0" y="0" width="840" height="42" rx="8" fill="#111420" stroke="#252c42" stroke-width="1.2"/>
    
    <g transform="translate(18, 25)" font-size="9" font-weight="800">
      <text x="0" y="0" fill="#a5b4fc">1. Av. Santa Helena</text>
      <text x="130" y="0" fill="#38bdf8">2. CEU Alvorada</text>
      <text x="250" y="0" fill="#fbbf24">3. Fábrica Bauducco</text>
      <text x="390" y="0" fill="#c4b5fd">4. Cond. Sta Teresa</text>
      <text x="530" y="0" fill="#34d399">5. Av. Ackel</text>
      <text x="635" y="0" fill="#93c5fd">6. R. Itá</text>
      <text x="705" y="0" fill="#f87171">★ 7. R. Estância (Marin)</text>
    </g>
  </g>

  <!-- Bússola Norte no Canto Superior Esquerdo -->
  <g transform="translate(45, 45)" filter="url(#shadow-card)">
    <circle cx="0" cy="0" r="18" fill="#141724" stroke="#334155" stroke-width="1.5"/>
    <polygon points="0,-12 4,0 0,-3 -4,0" fill="#ef4444"/>
    <polygon points="0,12 4,0 0,3 -4,0" fill="#64748b"/>
    <text x="0" y="-14" fill="#ef4444" font-size="8" font-weight="900" text-anchor="middle">N</text>
  </g>
</svg>