<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --gold: #E5B910;
    --emerald: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  body {
    width: 1080px;
    height: 1350px;
    background: #04121b;
    color: #F8F9F9;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 70px 60px;
  }
  .bg-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.25;
    filter: brightness(0.65);
    z-index: 0;
  }
  .bg-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(4,18,27,0.85) 0%, rgba(4,18,27,0.5) 40%, rgba(4,18,27,0.95) 90%);
    z-index: 1;
  }
  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    padding-bottom: 20px;
  }
  .brand {
    font-size: 15px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--gold);
  }
  .num { font-size: 14px; font-weight: 800; color: var(--gold); }
  .title-block {
    margin: 20px 0 14px;
  }
  .tag {
    color: var(--emerald);
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
    display: block;
  }
  h2 {
    font-size: 46px;
    font-weight: 800;
    line-height: 1.15;
    color: #FFFFFF;
  }
  h2 span { color: var(--emerald); }
  
  /* Mockup grande ocupando a tela com naturalidade */
  .browser-container {
    flex: 1;
    margin: 14px 0 20px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 30px 70px rgba(0,0,0,0.85);
    background: #020a10;
    border: 1px solid rgba(255,255,255,0.18);
    display: flex;
    flex-direction: column;
  }
  .browser-nav {
    background: #061824;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .dots { display: flex; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .d-r { background: #ef4444; }
  .d-y { background: #eab308; }
  .d-g { background: #22c55e; }
  .url-text {
    flex: 1;
    font-family: monospace;
    font-size: 13.5px;
    color: var(--emerald);
    text-align: center;
    letter-spacing: 0.04em;
  }
  .site-preview {
    flex: 1;
    overflow: hidden;
  }
  .site-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
  }
  /* 3 metricas diagramadas sem molduras de balisa */
  .metrics-editorial {
    display: flex;
    justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.15);
    padding: 16px 10px 0;
  }
  .m-item strong {
    display: block;
    font-size: 20px;
    font-weight: 800;
    color: #FFFFFF;
  }
  .m-item span {
    font-size: 14px;
    color: var(--gold);
    font-weight: 600;
  }
  .footer-row {
    border-top: 1px solid rgba(255,255,255,0.15);
    padding-top: 24px;
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    color: #CBD5E1;
  }
  .next { color: var(--gold); font-weight: 800; }
</style>
</head>
<body>
  <img src="C:/Vocação 2027/QG Vocação 2027 do zero/Site/jardim-vivo-essencial/assets/cena1-poster.jpg" class="bg-photo" alt="Background">
  <div class="bg-gradient"></div>

  <div class="content">
    <div class="top-row">
      <div class="brand">Vocação Comunicação &bull; Etapa 03</div>
      <div class="num">04 / 06</div>
    </div>

    <div class="title-block">
      <span class="tag">O Novo Site</span>
      <h2>Apresentação <span>Cinematográfica</span></h2>
    </div>

    <div class="browser-container">
      <div class="browser-nav">
        <div class="dots">
          <div class="dot d-r"></div>
          <div class="dot d-y"></div>
          <div class="dot d-g"></div>
        </div>
        <div class="url-text">https://jardimvivoessencial.com.br</div>
      </div>
      <div class="site-preview">
        <img src="C:/Vocação 2027/QG Vocação 2027 do zero/Site/cases/jardim-vivo-novo.png" alt="Novo Site">
      </div>
    </div>

    <div class="metrics-editorial">
      <div class="m-item">
        <strong>6 Cenas Fluidas</strong>
        <span>Scroll imersivo</span>
      </div>
      <div class="m-item">
        <strong>Carregamento 0.4s</strong>
        <span>10x mais veloz</span>
      </div>
      <div class="m-item">
        <strong>Domínio Próprio</strong>
        <span>Zero mensalidade</span>
      </div>
    </div>

    <div class="footer-row">
      <div>Landing page no ar</div>
      <div class="next">Próximo &rarr;</div>
    </div>
  </div>
</body>
</html>
