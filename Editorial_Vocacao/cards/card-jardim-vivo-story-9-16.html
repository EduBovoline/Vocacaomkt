<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg-dark: #04121b;
    --accent-gold: #E5B910;
    --accent-emerald: #10B981;
    --border: rgba(255, 255, 255, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  body {
    width: 1080px;
    height: 1920px; /* Formato 9:16 oficial Stories / Reels */
    background: #04121b;
    color: #F8F9F9;
    padding: 80px 60px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .glow-top {
    position: absolute;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(229, 185, 16, 0.15) 0%, rgba(16, 185, 129, 0.08) 45%, transparent 70%);
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
  }
  .header {
    text-align: center;
    border-bottom: 2px solid rgba(255,255,255,0.08);
    padding-bottom: 24px;
  }
  .brand-tag {
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--accent-gold);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .case-badge {
    display: inline-block;
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid var(--accent-emerald);
    color: var(--accent-emerald);
    padding: 6px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
  }
  .title-area {
    text-align: center;
    margin: 24px 0 16px;
  }
  h1 {
    font-size: 52px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: #FFFFFF;
  }
  h1 span {
    color: var(--accent-gold);
  }
  .subtitle {
    font-size: 22px;
    color: #A3B8C2;
    margin-top: 10px;
  }
  .comparison-vertical {
    display: flex;
    flex-direction: column;
    gap: 32px;
    margin: 16px 0;
    flex: 1;
    justify-content: center;
  }
  .card {
    background: #071d2b;
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 45px rgba(0,0,0,0.6);
  }
  .card-header {
    padding: 16px 24px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-antes .card-header {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border-bottom: 1px solid rgba(239, 68, 68, 0.25);
  }
  .card-depois .card-header {
    background: rgba(16, 185, 129, 0.18);
    color: var(--accent-emerald);
    border-bottom: 1px solid rgba(16, 185, 129, 0.3);
  }
  .card-img-wrap {
    width: 100%;
    height: 440px;
    background: #020a10;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-antes .card-img-wrap {
    background: #faeedd;
  }
  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }
  .card-depois .card-img-wrap img {
    object-position: top;
  }
  /* Bullet Points Horizontais Ultra Enxutos */
  .card-bullets {
    padding: 16px 24px;
    background: #061824;
    display: flex;
    justify-content: space-around;
    align-items: center;
    border-top: 1px solid var(--border);
  }
  .bullet-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 17px;
    font-weight: 700;
    color: #F8F9F9;
  }
  .dot-red {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ef4444;
    flex-shrink: 0;
  }
  .dot-green {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent-emerald);
    flex-shrink: 0;
  }
  .footer {
    text-align: center;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 24px;
  }
  .cta-box {
    background: linear-gradient(135deg, rgba(229, 185, 16, 0.15) 0%, rgba(16, 185, 129, 0.15) 100%);
    border: 1px solid var(--accent-gold);
    border-radius: 16px;
    padding: 18px 24px;
    font-size: 20px;
    font-weight: 700;
    color: #FFFFFF;
  }
  .cta-box span {
    color: var(--accent-gold);
  }
</style>
</head>
<body>
  <div class="glow-top"></div>
  
  <div class="header">
    <div class="brand-tag">Vocação Comunicação &bull; Estudo de Caso</div>
    <div class="case-badge">Vocação Update</div>
  </div>

  <div class="title-area">
    <h1>Jardim Vivo: <span>Antes &amp; Depois</span></h1>
    <p class="subtitle">Evolução visual e técnica de conversão.</p>
  </div>

  <div class="comparison-vertical">
    <!-- ANTES -->
    <div class="card card-antes">
      <div class="card-header">
        <span>Antes</span>
      </div>
      <div class="card-img-wrap">
        <img src="C:/Vocação 2027/QG Vocação 2027 do zero/Editorial_Vocacao/cases/inlead-antes-oficial-user.png" alt="Antes">
      </div>
      <div class="card-bullets">
        <div class="bullet-item"><span class="dot-red"></span> Subdomínio alheio</div>
        <div class="bullet-item"><span class="dot-red"></span> Carregamento lento</div>
        <div class="bullet-item"><span class="dot-red"></span> Mensalidade fixa</div>
      </div>
    </div>

    <!-- DEPOIS -->
    <div class="card card-depois">
      <div class="card-header">
        <span>Depois</span>
      </div>
      <div class="card-img-wrap">
        <img src="C:/Vocação 2027/QG Vocação 2027 do zero/Editorial_Vocacao/cases/jardim-vivo-novo.png" alt="Depois">
      </div>
      <div class="card-bullets">
        <div class="bullet-item"><span class="dot-green"></span> Domínio próprio</div>
        <div class="bullet-item"><span class="dot-green"></span> Carregamento 0.4s</div>
        <div class="bullet-item"><span class="dot-green"></span> Zero mensalidade</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="cta-box">
      Seu site novo em <span>5 dias úteis</span> &bull; <strong>vocacao.digital</strong>
    </div>
  </div>
</body>
</html>
