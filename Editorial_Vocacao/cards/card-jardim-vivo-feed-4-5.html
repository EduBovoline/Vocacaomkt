<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg-dark: #04121b;
    --accent-gold: #E5B910;
    --accent-emerald: #10B981;
    --border: rgba(255, 255, 255, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  body {
    width: 1080px;
    height: 1350px; /* Formato 4:5 oficial Feed Instagram */
    background: #04121b;
    color: #F8F9F9;
    padding: 60px 50px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .glow {
    position: absolute;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(229, 185, 16, 0.12) 0%, rgba(16, 185, 129, 0.05) 45%, transparent 70%);
    top: -180px;
    right: -180px;
    pointer-events: none;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid rgba(255,255,255,0.08);
    padding-bottom: 18px;
  }
  .brand-tag {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--accent-gold);
    font-weight: 700;
  }
  .case-badge {
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid var(--accent-emerald);
    color: var(--accent-emerald);
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
  }
  .title-area {
    margin: 16px 0 10px;
  }
  h1 {
    font-size: 40px;
    font-weight: 800;
    line-height: 1.18;
    letter-spacing: -0.02em;
    color: #FFFFFF;
  }
  h1 span {
    color: var(--accent-gold);
  }
  .subtitle {
    font-size: 19px;
    color: #A3B8C2;
    margin-top: 6px;
  }
  .comparison-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    margin: 18px 0;
    flex: 1;
  }
  .card {
    background: #071d2b;
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 18px 40px rgba(0,0,0,0.55);
  }
  .card-header {
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-antes .card-header {
    background: rgba(239, 68, 68, 0.14);
    color: #f87171;
    border-bottom: 1px solid rgba(239, 68, 68, 0.25);
  }
  .card-depois .card-header {
    background: rgba(16, 185, 129, 0.16);
    color: var(--accent-emerald);
    border-bottom: 1px solid rgba(16, 185, 129, 0.3);
  }
  .card-img-wrap {
    width: 100%;
    flex: 1;
    min-height: 540px;
    background: #020a10;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-antes .card-img-wrap {
    background: #faeedd;
  }
  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }
  .card-depois .card-img-wrap img {
    object-position: top;
  }
  /* Bullet Points Ultra Enxutos (Maximo 3 palavras) */
  .card-bullets {
    padding: 16px 20px;
    background: #061824;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-top: 1px solid var(--border);
  }
  .bullet-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
    color: #F8F9F9;
  }
  .dot-red {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ef4444;
    flex-shrink: 0;
  }
  .dot-green {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-emerald);
    flex-shrink: 0;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 18px;
    font-size: 15px;
    color: #A3B8C2;
  }
  .footer strong {
    color: var(--accent-gold);
  }
</style>
</head>
<body>
  <div class="glow"></div>
  
  <div class="header">
    <div class="brand-tag">Vocação Comunicação &bull; Estudo de Caso</div>
    <div class="case-badge">Vocação Update</div>
  </div>

  <div class="title-area">
    <h1>Jardim Vivo: <span>Antes &amp; Depois</span></h1>
    <p class="subtitle">Evolução visual e técnica de conversão.</p>
  </div>

  <div class="comparison-grid">
    <!-- ANTES -->
    <div class="card card-antes">
      <div class="card-header">
        <span>Antes</span>
      </div>
      <div class="card-img-wrap">
        <img src="C:/Vocação 2027/QG Vocação 2027 do zero/Editorial_Vocacao/cases/inlead-antes-oficial-user.png" alt="Antes">
      </div>
      <div class="card-bullets">
        <div class="bullet-item"><span class="dot-red"></span> Subdomínio alheio</div>
        <div class="bullet-item"><span class="dot-red"></span> Carregamento lento</div>
        <div class="bullet-item"><span class="dot-red"></span> Mensalidade fixa</div>
      </div>
    </div>

    <!-- DEPOIS -->
    <div class="card card-depois">
      <div class="card-header">
        <span>Depois</span>
      </div>
      <div class="card-img-wrap">
        <img src="C:/Vocação 2027/QG Vocação 2027 do zero/Editorial_Vocacao/cases/jardim-vivo-novo.png" alt="Depois">
      </div>
      <div class="card-bullets">
        <div class="bullet-item"><span class="dot-green"></span> Domínio próprio</div>
        <div class="bullet-item"><span class="dot-green"></span> Carregamento 0.4s</div>
        <div class="bullet-item"><span class="dot-green"></span> Zero mensalidade</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div>vocacao.digital</div>
    <div>Presença Digital <strong>de Alto Valor</strong></div>
  </div>
</body>
</html>
