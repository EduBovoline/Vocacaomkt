<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />

  <link rel="icon" type="image/svg+xml" href="assets/logo-imago.svg">
  <style>
    :root, .sw-root {
      --sw-bg: #FBF9F5;
      --sw-ink: #1C241B;
      --sw-ink-soft: #4A5649;
      --sw-accent: #253C22;
      --sw-font-display: 'Corbel', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --sw-font-body: 'Corbel', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* BRANDING OFICIAL COM OS SVGs */
    .sw-brand {
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
      text-decoration: none !important;
    }

    .sw-brand__mark {
      width: 40px !important;
      height: 36px !important;
      background: url('assets/logo-imago.svg') center / contain no-repeat !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      flex-shrink: 0;
    }

    .sw-brand__name {
      display: inline-block !important;
      height: 28px !important;
      width: 148px !important;
      background: url('assets/logo-tipografia.svg') left center / contain no-repeat !important;
      text-indent: -9999px !important;
      overflow: hidden !important;
      border: 0 !important;
    }

    .sw-topcta {
      background-color: var(--sw-accent) !important;
      color: #FFFFFF !important;
      font-weight: 700 !important;
      padding: 10px 22px !important;
      border-radius: 999px !important;
      box-shadow: 0 4px 14px rgba(37, 60, 34, 0.25) !important;
      text-decoration: none !important;
      letter-spacing: 0.02em;
      transition: transform 0.2s ease, background 0.2s ease !important;
    }

    .sw-topcta:hover {
      transform: translateY(-2px);
      background-color: #1a2d18 !important;
    }

    /* CINEMATIC EDITORIAL LAYOUT — SEM CAIXAS OU BORDAS ARTIFICIAIS */
    .sw-copylayer::before {
      content: "" !important;
      position: absolute !important;
      inset: 0 !important;
      width: min(60vw, 840px) !important;
      background: linear-gradient(90deg, rgba(16, 26, 17, 0.82) 0%, rgba(16, 26, 17, 0.58) 45%, rgba(16, 26, 17, 0.18) 75%, transparent 100%) !important;
      pointer-events: none !important;
    }

    /* O texto flutua naturalmente e com conforto óptico absoluto */
    .sw-copy {
      left: clamp(24px, 6vw, 90px) !important;
      width: min(88vw, 520px) !important;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      padding: 0 !important;
      border-radius: 0 !important;
      pointer-events: auto !important;
    }

    .sw-copy__num {
      display: inline-block !important;
      font-size: 0.8rem !important;
      font-weight: 700 !important;
      color: #A4DBC9 !important;
      background: rgba(255, 255, 255, 0.12) !important;
      padding: 4px 10px !important;
      border-radius: 6px !important;
      letter-spacing: 0.12em !important;
    }

    .sw-copy__eyebrow {
      margin-top: 14px !important;
      font-size: 0.82rem !important;
      font-weight: 700 !important;
      letter-spacing: 0.14em !important;
      text-transform: uppercase !important;
      color: #A4DBC9 !important;
      line-height: 1.3 !important;
    }

    .sw-copy__title {
      font-size: clamp(1.8rem, 2.7vw, 2.5rem) !important;
      line-height: 1.18 !important;
      margin: 12px 0 0 !important;
      letter-spacing: -0.02em !important;
      color: #FFFFFF !important;
      font-weight: 700 !important;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5) !important;
    }

    .sw-copy__body {
      margin-top: 16px !important;
      font-size: clamp(1rem, 1.2vw, 1.12rem) !important;
      line-height: 1.6 !important;
      color: #E8ECE6 !important;
      max-width: 100% !important;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5) !important;
    }

    .sw-copy__tags {
      margin: 22px 0 0 !important;
      gap: 8px !important;
    }

    .sw-copy__tags li {
      font-size: 0.82rem !important;
      font-weight: 600 !important;
      padding: 6px 14px !important;
      background: rgba(255, 255, 255, 0.12) !important;
      border: 1px solid rgba(255, 255, 255, 0.22) !important;
      color: #FFFFFF !important;
      border-radius: 999px !important;
      backdrop-filter: blur(4px) !important;
    }

    .sw-copy__cta {
      margin-top: 26px !important;
    }

    .sw-copy__cta a.sw-btn--primary {
      display: inline-block !important;
      background: #A4DBC9 !important;
      color: #121E14 !important;
      font-weight: 800 !important;
      font-size: 16px !important;
      padding: 16px 32px !important;
      border-radius: 999px !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35) !important;
      text-decoration: none !important;
      transition: transform 0.15s ease, background 0.15s ease !important;
    }

    .sw-copy__cta a.sw-btn--primary:hover {
      background: #c3ebd0 !important;
      transform: translateY(-2px) !important;
    }

    @media (max-width: 860px) {
      .sw-copylayer::before {
        width: 100% !important;
        height: 65% !important;
        top: auto !important;
        bottom: 0 !important;
        background: linear-gradient(0deg, rgba(16, 26, 17, 0.92) 0%, rgba(16, 26, 17, 0.7) 50%, transparent 100%) !important;
      }
      .sw-copy {
        left: 20px !important;
        right: 20px !important;
        width: auto !important;
        max-width: none !important;
        top: auto !important;
        bottom: calc(24px + env(safe-area-inset-bottom)) !important;
      }
      .sw-copy__title {
        font-size: 1.55rem !important;
      }
      .sw-copy__body {
        font-size: 0.95rem !important;
      }
    }
  </style>
</head>
